<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just stepping | Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Side -->
        <div class="login-brand">

            <div class="logo">
                <span class="logo-icon">Just stepping 👟</span>
                <span></span>
            </div>

            <div class="brand-content">
                <h1>Step Into<br>Management.</h1>

                <p>
                    Manage your shoes, products, orders and customers
                    from one powerful dashboard.
                </p>
            </div>

            <div class="brand-footer">
                <p>© 2026 Just stepping. All rights reserved.</p>
            </div>

        </div>


        <!-- Right Side -->
        <div class="login-section">

            <div class="login-box">

                <div class="mobile-logo">
                    <span class="logo-icon">👟</span>
                    <span>Just stepping</span>
                </div>

                <p class="welcome">WELCOME BACK</p>

                <h2>Admin Login</h2>

                <p class="login-description">
                    Login to access your administration dashboard.
                </p>


                <form action="dashboard.html" method="get">

                    <!-- Email -->
                    <div class="input-group">

                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@example.com"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="input-group">

                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Remember + Forgot -->
                    <div class="login-options">

                        <label class="remember">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>


                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        
                        Login to Dashboard
                        <span>→</span>
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
